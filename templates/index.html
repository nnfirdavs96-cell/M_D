<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Выберите дизайн сайта</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f4f5f7;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 24px 32px;
      text-align: center;
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #111;
    }
    header p {
      margin-top: 6px;
      font-size: .95rem;
      color: #666;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 28px;
      max-width: 1240px;
      margin: 40px auto;
      padding: 0 24px 60px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #ddd;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      transition: box-shadow .2s, transform .2s;
    }
    .card:hover {
      box-shadow: 0 8px 32px rgba(0,0,0,.12);
      transform: translateY(-4px);
    }

    .card-preview {
      position: relative;
      height: 240px;
      overflow: hidden;
      background: #eee;
    }
    .card-preview iframe {
      width: 200%;
      height: 200%;
      border: none;
      transform: scale(.5);
      transform-origin: top left;
      pointer-events: none;
    }
    .card-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.35);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .2s;
    }
    .card:hover .card-overlay { opacity: 1; }
    .overlay-btn {
      padding: 10px 24px;
      background: #fff;
      color: #222;
      border-radius: 999px;
      font-weight: 600;
      font-size: .9rem;
      text-decoration: none;
      transition: background .2s;
    }
    .overlay-btn:hover { background: #f0f0f0; }

    .card-body {
      padding: 18px 20px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #111;
    }
    .btn-view {
      display: inline-block;
      padding: 9px 22px;
      background: #222;
      color: #fff;
      border-radius: 8px;
      font-size: .875rem;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: background .2s;
    }
    .btn-view:hover { background: #444; }

    footer {
      text-align: center;
      padding: 24px;
      color: #999;
      font-size: .82rem;
      border-top: 1px solid #e0e0e0;
    }

    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Выберите вариант дизайна</h1>
    <p>Нажмите «Посмотреть», чтобы открыть сайт в полном размере</p>
  </header>

  <div class="grid">

    <!-- Сайт 1 -->
    <div class="card">
      <div class="card-preview">
        <iframe src="site1/index.html" loading="lazy" title="Сайт 1"></iframe>
        <div class="card-overlay">
          <a href="site1/index.html" target="_blank" class="overlay-btn">Открыть</a>
        </div>
      </div>
      <div class="card-body">
        <span class="card-title">Вариант 1</span>
        <a href="site1/index.html" target="_blank" class="btn-view">Посмотреть</a>
      </div>
    </div>
